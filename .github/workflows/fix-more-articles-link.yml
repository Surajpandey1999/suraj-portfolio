name: Fix More Articles homepage link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update article link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('posts/politicisation-of-indian-youth.html')
          s = p.read_text(encoding='utf-8')
          old = 'href="https://surajpandey1999.github.io"'
          new = 'href="https://surajpandey1999.github.io/suraj-portfolio/"'
          if old not in s:
              raise SystemExit('Expected More articles homepage link was not found.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/politicisation-of-indian-youth.html
          git commit -m "Fix More Articles homepage link"
          git push
