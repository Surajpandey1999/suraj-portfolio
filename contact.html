<section class="page-hero">
    <h1>Get in Touch</h1>
    <p>Have a project, a role, or just want to say hi? Send a message below.</p>
</section>

<div class="container">

    <div class="contact-info">
        📧 <a href="mailto:youremail@example.com">youremail@example.com</a> &nbsp;|&nbsp;
        🔗 <a href="https://www.linkedin.com/in/yourprofile" target="_blank">LinkedIn</a> &nbsp;|&nbsp;
        💻 <a href="https://github.com/surajpandey1999" target="_blank">GitHub</a>
    </div>

    <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>

        <p style="text-align:center;">
            <button class="btn" type="submit" style="border:none;cursor:pointer;font-size:1rem;">Send Message</button>
        </p>
    </form>

</div>
